<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>RP Gezichtsveld Simulator</title>

<style>

/* ==================================================
   BASIS
   ================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}


/* ==================================================
   NORMALE WEERGAVE
   ================================================== */

#normalView {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

    z-index: 1;
}


#camera {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    background: #000;
}


/* ==================================================
   RP MASKER NORMAAL
   ================================================== */

#rpMask {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 5;

    pointer-events: none;

    background:

        radial-gradient(

            ellipse
            var(--field-width)
            var(--field-height)

            at center,

            transparent 0%,

            transparent 50%,

            rgba(0,0,0,0.10) 60%,

            rgba(0,0,0,0.45) 75%,

            rgba(0,0,0,0.85) 90%,

            #000 100%
        );
}


/* ==================================================
   VR WEERGAVE
   ================================================== */

#vrView {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    background: #000;

    overflow: hidden;

    z-index: 10;
}


.vrEye {

    position: relative;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


.vrVideo {

    position: absolute;

    top: 0;

    width: 200%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* Linker beeld */

#vrLeft .vrVideo {

    left: 0;
}


/* Rechter beeld */

#vrRight .vrVideo {

    left: -100%;
}


/* ==================================================
   RP MASKER VR
   ================================================== */

.vrMask {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    background:

        radial-gradient(

            ellipse
            var(--field-width)
            var(--field-height)

            at center,

            transparent 0%,

            transparent 50%,

            rgba(0,0,0,0.10) 60%,

            rgba(0,0,0,0.45) 75%,

            rgba(0,0,0,0.85) 90%,

            #000 100%
        );
}


/* ==================================================
   BEDIENING
   ================================================== */

#controls {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 100;

    width: 100%;

    padding:
        15px
        15px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(0,0,0,0.82);

    color: white;

    text-align: center;

    max-height: 55vh;

    overflow-y: auto;

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}


/* ==================================================
   VR: BEDIENING VERBERGEN
   ================================================== */

body.vrMode #controls {

    opacity: 0;

    transform:
        translateY(100%);

    pointer-events: none;
}


/* Wanneer bediening tijdelijk zichtbaar is */

body.vrControlsVisible #controls {

    opacity: 1;

    transform:
        translateY(0);

    pointer-events: auto;
}


/* ==================================================
   KNOPPEN
   ================================================== */

button {

    display: block;

    width: min(90%, 420px);

    margin: 8px auto;

    padding: 15px;

    border: none;

    border-radius: 14px;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

    background: white;

    color: black;

    -webkit-tap-highlight-color:
        transparent;
}


button:active {

    transform: scale(0.98);
}


/* ==================================================
   SLIDER
   ================================================== */

label {

    display: block;

    margin-top: 15px;

    font-size: 18px;
}


input[type="range"] {

    display: block;

    width: min(90%, 500px);

    height: 35px;

    margin: 5px auto 10px;

    accent-color: white;
}


/* ==================================================
   STATUS
   ================================================== */

#status {

    min-height: 22px;

    margin-top: 8px;

    font-size: 15px;

    color: #ccc;
}


/* ==================================================
   VR MODUS
   ================================================== */

body.vrMode #normalView {

    display: none;
}


body.vrMode #vrView {

    display: flex;
}


/* ==================================================
   FULLSCREEN
   ================================================== */

:fullscreen #normalView {

    width: 100vw;
    height: 100vh;
}


:fullscreen #camera {

    width: 100vw;
    height: 100vh;
}


:fullscreen #rpMask {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;
}


/* Safari */

:-webkit-full-screen #normalView {

    width: 100vw;
    height: 100vh;
}


:-webkit-full-screen #camera {

    width: 100vw;
    height: 100vh;
}


:-webkit-full-screen #rpMask {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;
}


/* ==================================================
   FULLSCREEN VR
   ================================================== */

:fullscreen #vrView {

    width: 100vw;
    height: 100vh;
}


:fullscreen .vrEye {

    width: 50%;
    height: 100vh;
}


:fullscreen .vrMask {

    width: 100%;
    height: 100%;
}


:-webkit-full-screen #vrView {

    width: 100vw;
    height: 100vh;
}


:-webkit-full-screen .vrEye {

    width: 50%;
    height: 100vh;
}


:-webkit-full-screen .vrMask {

    width: 100%;
    height: 100%;
}


/* ==================================================
   DESKTOP
   ================================================== */

@media (min-width: 800px) {

    #controls {

        max-width: 650px;

        left: 50%;

        right: auto;

        transform:
            translateX(-50%);

        border-radius:
            20px 20px 0 0;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     NORMALE CAMERA
     ================================================== -->

<div id="normalView">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <div id="rpMask"></div>

</div>


<!-- ==================================================
     VR MODUS
     ================================================== -->

<div id="vrView">


    <!-- LINKER OOG -->

    <div
        id="vrLeft"
        class="vrEye">

        <video
            id="vrVideoLeft"
            class="vrVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="vrMask"></div>

    </div>


    <!-- RECHTER OOG -->

    <div
        id="vrRight"
        class="vrEye">

        <video
            id="vrVideoRight"
            class="vrVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="vrMask"></div>

    </div>


</div>


<!-- ==================================================
     BEDIENING
     ================================================== -->

<div id="controls">


    <button id="start">

        📷 Camera starten

    </button>


    <button id="switch">

        🔄 Camera omkeren

    </button>


    <button id="vrButton">

        🥽 VR-modus

    </button>


    <button id="fullscreen">

        ⛶ Volledig scherm

    </button>


    <label>

        Gezichtsveld:

        <strong id="value">

            100%

        </strong>

    </label>


    <input
        id="fov"
        type="range"
        min="5"
        max="100"
        value="100"
        step="1">


    <div id="status">

        Camera nog niet gestart.

    </div>


    <div style="
        max-width:600px;
        margin:10px auto;
        color:#aaa;
        font-size:14px;
        line-height:1.4;
    ">

        100% = normaal gezichtsveld.<br>

        5% = zeer sterk beperkt
        centraal gezichtsveld.

    </div>


</div>


<script>


/* ==================================================
   ELEMENTEN
   ================================================== */

const camera =
    document.getElementById(
        "camera"
    );


const vrVideoLeft =
    document.getElementById(
        "vrVideoLeft"
    );


const vrVideoRight =
    document.getElementById(
        "vrVideoRight"
    );


const startButton =
    document.getElementById(
        "start"
    );


const switchButton =
    document.getElementById(
        "switch"
    );


const vrButton =
    document.getElementById(
        "vrButton"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


const slider =
    document.getElementById(
        "fov"
    );


const value =
    document.getElementById(
        "value"
    );


const status =
    document.getElementById(
        "status"
    );


/* ==================================================
   VARIABELEN
   ================================================== */

let stream = null;

let facingMode =
    "environment";

let vrMode = false;


/* ==================================================
   GEZICHTSVELD
   ================================================== */

function updateView() {


    const fov =
        Number(
            slider.value
        );


    value.textContent =
        fov + "%";


    /*
       Bepaal de grootte van het
       centrale gezichtsveld.
    */

    const width =
        5 + (fov * 0.95);


    const height =
        5 + (fov * 0.90);


    document.documentElement
        .style
        .setProperty(
            "--field-width",
            width + "%"
        );


    document.documentElement
        .style
        .setProperty(
            "--field-height",
            height + "%"
        );
}


/* ==================================================
   CAMERA STARTEN
   ================================================== */

async function startCamera() {


    status.textContent =
        "Camera wordt gestart...";


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices
            .getUserMedia
    ) {

        status.textContent =
            "Deze browser ondersteunt geen camera.";

        return;
    }


    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;
    }


    try {


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                facingMode

                        }

                    },

                    audio: false

                });


        camera.srcObject =
            stream;


        vrVideoLeft.srcObject =
            stream;


        vrVideoRight.srcObject =
            stream;


        await camera.play();


        await vrVideoLeft.play();


        await vrVideoRight.play();


        status.textContent =
            "Camera actief.";


    }
    catch (error) {


        console.error(
            error
        );


        if (
            error.name ===
            "NotAllowedError"
        ) {

            status.textContent =
                "Cameratoegang is geweigerd.";

        }

        else if (
            error.name ===
            "NotFoundError"
        ) {

            status.textContent =
                "Geen camera gevonden.";

        }

        else {

            status.textContent =
                "Camera kon niet worden gestart: "
                + error.message;
        }
    }
}


/* ==================================================
   CAMERA OMDRAAIEN
   ================================================== */

async function switchCamera() {


    if (
        facingMode ===
        "environment"
    ) {

        facingMode =
            "user";

    }
    else {

        facingMode =
            "environment";
    }


    await startCamera();
}


/* ==================================================
   FULLSCREEN
   ================================================== */

async function enterFullscreen() {


    try {


        if (
            document.fullscreenElement
        ) {

            return true;
        }


        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen();

            return true;
        }


        if (
            document.documentElement
                .webkitRequestFullscreen
        ) {

            await document
                .documentElement
                .webkitRequestFullscreen();

            return true;
        }


    }
    catch (error) {

        console.log(
            "Fullscreen niet beschikbaar:",
            error
        );
    }


    return false;
}


/* ==================================================
   FULLSCREEN VERLATEN
   ================================================== */

async function exitFullscreen() {


    try {


        if (
            document.exitFullscreen
        ) {

            await document
                .exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            await document
                .webkitExitFullscreen();

        }


    }
    catch (error) {

        console.log(error);
    }
}


/* ==================================================
   VR MODUS
   ================================================== */

async function toggleVR() {


    vrMode =
        !vrMode;


    if (vrMode) {


        /*
           VR inschakelen
        */

        document.body
            .classList
            .add(
                "vrMode"
            );


        /*
           Bedieningspaneel verbergen
        */

        document.body
            .classList
            .remove(
                "vrControlsVisible"
            );


        vrButton.textContent =
            "📱 Normale weergave";


        /*
           Probeer automatisch
           fullscreen te openen.
        */

        await enterFullscreen();


    }
    else {


        /*
           VR uitschakelen
        */

        document.body
            .classList
            .remove(
                "vrMode"
            );


        document.body
            .classList
            .remove(
                "vrControlsVisible"
            );


        vrButton.textContent =
            "🥽 VR-modus";

    }
}


/* ==================================================
   TIK OP SCHERM
   ================================================== */

document.addEventListener(
    "click",
    function(event) {


        /*
           In VR-modus kunnen we met een
           tik de bediening zichtbaar maken.

           Als je op een knop tikt,
           doen we niets extra's.
        */

        if (!vrMode) {

            return;
        }


        if (
            event.target.closest(
                "#controls"
            )
        ) {

            return;
        }


        document.body
            .classList
            .toggle(
                "vrControlsVisible"
            );

    }
);


/* ==================================================
   FULLSCREEN KNOP
   ================================================== */

fullscreenButton.addEventListener(
    "click",
    async function() {


        if (
            document.fullscreenElement
        ) {

            await exitFullscreen();

        }
        else {

            await enterFullscreen();

        }

    }
);


/* ==================================================
   EVENT LISTENERS
   ================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


switchButton.addEventListener(
    "click",
    switchCamera
);


vrButton.addEventListener(
    "click",
    toggleVR
);


slider.addEventListener(
    "input",
    updateView
);


/* ==================================================
   INITIALISEREN
   ================================================== */

updateView();


/* ==================================================
   CAMERA STOPPEN BIJ VERLATEN
   ================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

    }
);

</script>

</body>
</html>
