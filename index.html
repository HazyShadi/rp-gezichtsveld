<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>RP Gezichtsveld Simulator</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* =========================
   CAMERA
   ========================= */

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

    transform: scale(1);

    filter:
        contrast(var(--contrast))
        brightness(var(--brightness));

    transition:
        filter 0.2s ease,
        transform 0.2s ease;
}

/* =========================
   RP GEZICHTSVELD MASKER
   ========================= */

#rpMask {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;

    /*
       Het centrale gedeelte blijft transparant.
       Naar de buitenkant wordt het beeld steeds donkerder.
    */

    background:
        radial-gradient(
            ellipse var(--field-width) var(--field-height)
            at center,

            rgba(0,0,0,0) 0%,

            rgba(0,0,0,0) 55%,

            rgba(0,0,0,0.15) 65%,

            rgba(0,0,0,0.55) 78%,

            rgba(0,0,0,0.88) 90%,

            #000 100%
        );

    transition: background 0.2s ease;
}

/*
   Extra subtiele donkere rand.
   Hierdoor is het effect minder "perfect rond".
*/

#rpVignette {
    position: fixed;
    inset: 0;

    z-index: 6;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,0.12) 70%,
            rgba(0,0,0,0.55) 100%
        );
}

/* =========================
   NACHT / LAAG CONTRAST
   ========================= */

#nightOverlay {
    position: fixed;
    inset: 0;

    z-index: 7;

    pointer-events: none;

    background:
        rgba(20, 20, 20, var(--night-opacity));

    mix-blend-mode: multiply;

    transition:
        opacity 0.2s ease;
}

/* =========================
   BEDIENING
   ========================= */

#controls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 20;

    padding:
        20px
        20px
        calc(20px + env(safe-area-inset-bottom));

    background: rgba(0,0,0,0.78);

    color: white;

    text-align: center;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    max-height: 55vh;

    overflow-y: auto;
}

/* =========================
   KNOPPEN
   ========================= */

button {
    display: block;

    width: min(90%, 420px);

    margin: 10px auto;

    padding: 15px;

    border: 0;

    border-radius: 14px;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

    color: #111;

    background: #fff;

    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(0.98);
}

/* =========================
   LABELS
   ========================= */

label {
    display: block;

    font-size: 19px;

    margin-top: 18px;

    margin-bottom: 5px;
}

.value {
    font-weight: bold;
}

/* =========================
   SLIDERS
   ========================= */

input[type="range"] {
    display: block;

    width: min(90%, 500px);

    margin: 8px auto;

    height: 35px;

    accent-color: white;
}

/* =========================
   STATUS
   ========================= */

#status {
    margin-top: 10px;

    font-size: 16px;

    color: #cccccc;

    min-height: 22px;
}

/* =========================
   UITLEG
   ========================= */

#info {
    width: min(90%, 600px);

    margin: 15px auto 0;

    font-size: 14px;

    line-height: 1.4;

    color: #aaa;
}

/* =========================
   VOLLEDIG SCHERM
   ========================= */

body.fullscreen #controls {
    background: rgba(0,0,0,0.65);
}

/* =========================
   DESKTOP
   ========================= */

@media (min-width: 800px) {

    #controls {
        max-width: 650px;

        left: 50%;

        right: auto;

        transform: translateX(-50%);

        border-radius: 20px 20px 0 0;
    }
}

</style>
</head>


<body>

<!-- =========================
     CAMERA
     ========================= -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- =========================
     RP MASKER
     ========================= -->

<div id="rpMask"></div>

<div id="rpVignette"></div>

<div id="nightOverlay"></div>


<!-- =========================
     BEDIENING
     ========================= -->

<div id="controls">

    <button id="start">
        📷 Camera starten
    </button>


    <button id="switch">
        🔄 Camera omkeren
    </button>


    <button id="fullscreen">
        ⛶ Volledig scherm
    </button>


    <!-- GEZICHTSVELD -->

    <label for="fov">
        Gezichtsveld:
        <span
            id="value"
            class="value">
            100%
        </span>
    </label>

    <input
        id="fov"
        type="range"
        min="5"
        max="100"
        value="100"
        step="1">


    <!-- CONTRAST -->

    <label for="contrast">
        Contrast:
        <span
            id="contrastValue"
            class="value">
            100%
        </span>
    </label>

    <input
        id="contrast"
        type="range"
        min="60"
        max="160"
        value="100"
        step="1">


    <!-- NACHTZICHT -->

    <label for="night">
        Nacht / slecht contrast:
        <span
            id="nightValue"
            class="value">
            0%
        </span>
    </label>

    <input
        id="night"
        type="range"
        min="0"
        max="70"
        value="0"
        step="1">


    <div id="status">
        Camera nog niet gestart.
    </div>


    <div id="info">
        Deze simulatie geeft een indruk van een beperkt
        gezichtsveld zoals dat bij RP kan voorkomen.
        De instellingen zijn een visuele benadering en
        vormen geen medische simulatie.
    </div>

</div>


<script>

/* ==================================================
   ELEMENTEN
   ================================================== */

const video =
    document.getElementById("camera");

const startButton =
    document.getElementById("start");

const switchButton =
    document.getElementById("switch");

const fullscreenButton =
    document.getElementById("fullscreen");

const slider =
    document.getElementById("fov");

const value =
    document.getElementById("value");

const contrastSlider =
    document.getElementById("contrast");

const contrastValue =
    document.getElementById("contrastValue");

const nightSlider =
    document.getElementById("night");

const nightValue =
    document.getElementById("nightValue");

const status =
    document.getElementById("status");

const rpMask =
    document.getElementById("rpMask");

const nightOverlay =
    document.getElementById("nightOverlay");


/* ==================================================
   VARIABELEN
   ================================================== */

let stream = null;

let facingMode = "environment";


/* ==================================================
   RP GEZICHTSVELD
   ================================================== */

function updateView() {

    const fov =
        Number(slider.value);

    value.textContent =
        fov + "%";


    /*
       We zoomen het camerabeeld NIET meer in.

       Het beeld blijft schermvullend.

       Alleen het zichtbare centrale gebied
       wordt kleiner.
    */

    video.style.transform =
        "scale(1)";


    /*
       Berekening van het centrale
       gezichtsveld.

       100% = groot centraal gebied
       20%  = klein centraal gebied
    */

    const width =
        30 + (fov * 0.70);

    const height =
        25 + (fov * 0.65);


    document.documentElement
        .style
        .setProperty(
            "--field-width",
            width + "%"
        );


    document.documentElement
        .style
        .setProperty(
            "--field-height",
            height + "%"
        );
}


/* ==================================================
   CONTRAST
   ================================================== */

function updateContrast() {

    const contrast =
        Number(contrastSlider.value);

    contrastValue.textContent =
        contrast + "%";

    document.documentElement
        .style
        .setProperty(
            "--contrast",
            (contrast / 100)
        );
}


/* ==================================================
   NACHT / SLECHT CONTRAST
   ================================================== */

function updateNight() {

    const night =
        Number(nightSlider.value);

    nightValue.textContent =
        night + "%";

    document.documentElement
        .style
        .setProperty(
            "--night-opacity",
            (night / 100)
        );
}


/* ==================================================
   CAMERA STARTEN
   ================================================== */

async function startCamera() {

    status.textContent =
        "Camera wordt gestart...";


    /*
       Controleer browserondersteuning.
    */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Deze browser ondersteunt geen cameratoegang.";

        return;
    }


    /*
       Stop eventuele oude camera.
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;
    }


    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: facingMode
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        status.textContent =
            "Camera actief.";

    }

    catch (error) {

        console.error(error);


        if (
            error.name ===
            "NotAllowedError"
        ) {

            status.textContent =
                "Cameratoegang is geweigerd. Geef deze website toegang tot de camera.";

        }

        else if (
            error.name ===
            "NotFoundError"
        ) {

            status.textContent =
                "Er is geen camera gevonden.";

        }

        else {

            status.textContent =
                "Camera kon niet worden gestart: "
                + error.message;
        }
    }
}


/* ==================================================
   CAMERA OMDRAAIEN
   ================================================== */

async function switchCamera() {

    if (facingMode === "environment") {

        facingMode = "user";

    }

    else {

        facingMode = "environment";

    }


    status.textContent =
        "Camera wordt omgedraaid...";


    await startCamera();
}


/* ==================================================
   VOLLEDIG SCHERM
   ================================================== */

async function toggleFullscreen() {

    try {

        if (!document.fullscreenElement) {

            if (
                document.documentElement
                    .requestFullscreen
            ) {

                await document.documentElement
                    .requestFullscreen();
            }

            else {

                /*
                   iPhone Safari ondersteunt
                   de standaard fullscreen API
                   niet overal.

                   De video kan daar wel
                   schermvullend worden weergegeven
                   wanneer de browser dat toestaat.
                */

                if (
                    video.webkitEnterFullscreen
                ) {

                    video.webkitEnterFullscreen();
                }
            }

        }

        else {

            await document.exitFullscreen();
        }

    }

    catch (error) {

        console.log(
            "Fullscreen niet beschikbaar:",
            error
        );
    }
}


/* ==================================================
   EVENT LISTENERS
   ================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


switchButton.addEventListener(
    "click",
    switchCamera
);


fullscreenButton.addEventListener(
    "click",
    toggleFullscreen
);


slider.addEventListener(
    "input",
    updateView
);


contrastSlider.addEventListener(
    "input",
    updateContrast
);


nightSlider.addEventListener(
    "input",
    updateNight
);


/* ==================================================
   INITIALISEREN
   ================================================== */

updateView();

updateContrast();

updateNight();


/* ==================================================
   FULLSCREEN STATUS
   ================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            document.body.classList
                .add("fullscreen");

            fullscreenButton.textContent =
                "✕ Volledig scherm verlaten";

        }

        else {

            document.body.classList
                .remove("fullscreen");

            fullscreenButton.textContent =
                "⛶ Volledig scherm";
        }
    }
);


/* ==================================================
   CAMERA STOPPEN BIJ VERLATEN PAGINA
   ================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(track => track.stop());
        }
    }
);

</script>

</body>
</html>
