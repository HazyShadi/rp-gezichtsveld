<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>RP Gezichtsveld</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* =========================
   NORMAAL CAMERA BEELD
   ========================= */

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    object-fit: cover;
    background: #000;

    transform-origin: center center;

    z-index: 1;
}


/* =========================
   VR WEERGAVE
   ========================= */

#vrView {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    background: #000;

    overflow: hidden;

    z-index: 2;
}


/*
   HIER KUN JE DE AFSTAND TUSSEN
   DE TWEE OGEN INSTELLEN.

   Kleinere waarde =
   cirkels dichter bij elkaar.

   Bijvoorbeeld:

   4vw  = dichter bij elkaar
   6vw  = standaard
   8vw  = verder uit elkaar
*/

:root {
    --eye-gap: 4vw;
}


/* Iedere helft van het VR-scherm */

.eye {
    position: absolute;

    top: 50%;

    width: 34vw;
    height: 34vw;

    max-width: 500px;
    max-height: 500px;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    overflow: hidden;

    transform: translateY(-50%);

    background: #000;
}


/* Linkeroog */

#leftEye {
    left: calc(50% - var(--eye-gap) - 34vw);
}


/* Rechteroog */

#rightEye {
    right: calc(50% - var(--eye-gap) - 34vw);
}


/*
   De camera's binnen de cirkels
*/

.eye video {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform-origin: center center;
}


/* =========================
   BEDIENING
   ========================= */

#controls {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        20px
        20px
        calc(20px + env(safe-area-inset-bottom));

    background: rgba(0,0,0,0.75);

    color: white;

    text-align: center;

    z-index: 10;
}


button {

    display: block;

    width: min(90%, 420px);

    margin: 10px auto;

    padding: 18px;

    border: 0;

    border-radius: 15px;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;
}


#start {
    background: #ffffff;
    color: #000;
}


#vr {
    background: #ffffff;
    color: #000;
}


#fullscreen {
    background: #ffffff;
    color: #000;
}


label {

    display: block;

    font-size: 22px;

    margin-top: 20px;
}


input[type="range"] {

    width: 80%;

    margin: 15px auto;

    height: 35px;
}


#status {

    margin-top: 10px;

    font-size: 18px;

    color: #aaaaaa;
}


/*
   In VR-modus worden de normale bediening
   en het normale camerabeeld verborgen.
*/

body.vr-mode #camera {
    display: none;
}

body.vr-mode #vrView {
    display: block;
}

body.vr-mode #controls {
    display: none;
}


/*
   Kleine groene status-indicator
*/

#vrIndicator {

    position: fixed;

    left: 50px;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #00d060;

    display: none;

    z-index: 20;
}

body.vr-mode #vrIndicator {
    display: block;
}

</style>
</head>


<body>


<!-- =========================
     NORMAAL CAMERA BEELD
     ========================= -->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>


<!-- =========================
     VR BEELD
     ========================= -->

<div id="vrView">

    <div class="eye" id="leftEye">
        <video
            id="leftVideo"
            autoplay
            playsinline
            muted>
        </video>
    </div>


    <div class="eye" id="rightEye">
        <video
            id="rightVideo"
            autoplay
            playsinline
            muted>
        </video>
    </div>

</div>


<!-- Groene indicator -->

<div id="vrIndicator"></div>


<!-- =========================
     BEDIENING
     ========================= -->

<div id="controls">

    <button id="start">
        Camera starten
    </button>


    <button id="vr">
        VR-modus
    </button>


    <button id="fullscreen">
        Volledig scherm
    </button>


    <label>
        Gezichtsveld:
        <span id="value">100%</span>
    </label>


    <input
        id="fov"
        type="range"
        min="5"
        max="100"
        value="100"
        step="1">


    <div id="status"></div>

</div>


<script>

/* =====================================================
   ELEMENTEN
   ===================================================== */

const camera = document.getElementById("camera");

const leftVideo =
    document.getElementById("leftVideo");

const rightVideo =
    document.getElementById("rightVideo");

const startButton =
    document.getElementById("start");

const vrButton =
    document.getElementById("vr");

const fullscreenButton =
    document.getElementById("fullscreen");

const slider =
    document.getElementById("fov");

const value =
    document.getElementById("value");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABELEN
   ===================================================== */

let stream = null;

let vrMode = false;


/*
   De huidige zoom.

   100% = normaal beeld

   5% = zeer klein gezichtsveld
*/

let currentFov = 100;


/* =====================================================
   GEZICHTSVELD AANPASSEN
   ===================================================== */

function updateView() {

    currentFov = Number(slider.value);

    value.textContent =
        currentFov + "%";


    /*
       100% = zoom 1
       50%  = zoom 2
       20%  = zoom 5
       5%   = zoom 20
    */

    const zoom =
        100 / currentFov;


    /*
       Normale camera
    */

    camera.style.transform =
        `scale(${zoom})`;


    /*
       VR-camera's
    */

    leftVideo.style.transform =
        `scale(${zoom})`;

    rightVideo.style.transform =
        `scale(${zoom})`;
}


/* =====================================================
   SLIDER
   ===================================================== */

slider.addEventListener(
    "input",
    updateView
);


/* =====================================================
   CAMERA STARTEN
   ===================================================== */

async function startCamera() {

    status.textContent = "";


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Deze browser ondersteunt geen cameratoegang.";

        return;
    }


    /*
       Bestaande camera stoppen
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());
    }


    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });


        /*
           Hetzelfde camerabeeld
           wordt naar alle drie de video's gestuurd.
        */

        camera.srcObject = stream;

        leftVideo.srcObject = stream;

        rightVideo.srcObject = stream;


        await camera.play();

        await leftVideo.play();

        await rightVideo.play();


        status.textContent =
            "Camera actief";


        /*
           Zorg dat huidige sliderwaarde
           direct wordt toegepast.
        */

        updateView();


    } catch (error) {

        console.error(error);

        status.textContent =
            "Camera kon niet worden gestart.";
    }
}


/* =====================================================
   CAMERA START KNOP
   ===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   VR MODUS
   ===================================================== */

async function enterVRMode() {

    if (!stream) {

        await startCamera();

        /*
           Even wachten tot de camera
           daadwerkelijk beschikbaar is.
        */

        if (!stream) {
            return;
        }
    }


    vrMode = true;

    document.body.classList.add(
        "vr-mode"
    );


    /*
       Probeer automatisch liggend scherm
       te gebruiken.
    */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );
        }

    } catch (error) {

        console.log(
            "Orientation lock niet beschikbaar."
        );
    }


    /*
       Probeer volledig scherm te activeren.
    */

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();
        }

    } catch (error) {

        console.log(
            "Fullscreen niet beschikbaar."
        );
    }


    updateView();
}


/* =====================================================
   VR MODUS VERLATEN
   ===================================================== */

async function exitVRMode() {

    vrMode = false;

    document.body.classList.remove(
        "vr-mode"
    );


    /*
       Volledig scherm verlaten
    */

    try {

        if (document.fullscreenElement) {

            await document.exitFullscreen();
        }

    } catch (error) {

        console.log(error);
    }


    /*
       Orientation lock vrijgeven
    */

    try {

        if (
            screen.orientation &&
            screen.orientation.unlock
        ) {

            screen.orientation.unlock();
        }

    } catch (error) {

        console.log(error);
    }
}


/* =====================================================
   VR KNOP
   ===================================================== */

vrButton.addEventListener(
    "click",
    async () => {

        if (!vrMode) {

            await enterVRMode();

        } else {

            await exitVRMode();
        }
    }
);


/* =====================================================
   VOLLEDIG SCHERM
   ===================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();
            }

        } catch (error) {

            console.error(error);
        }
    }
);


/* =====================================================
   FULLSCREEN STATUS BIJWERKEN
   ===================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        if (document.fullscreenElement) {

            fullscreenButton.textContent =
                "Volledig scherm verlaten";

        } else {

            fullscreenButton.textContent =
                "Volledig scherm";
        }
    }
);


/* =====================================================
   BIJ ROTEREN VAN DE TELEFOON
   ===================================================== */

window.addEventListener(
    "orientationchange",
    () => {

        /*
           Browser opnieuw laten berekenen
           nadat het scherm is gedraaid.
        */

        setTimeout(() => {

            updateView();

        }, 300);
    }
);


/* =====================================================
   INITIËLE INSTELLING
   ===================================================== */

updateView();

</script>

</body>
</html>
