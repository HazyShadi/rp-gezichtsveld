<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RP Gezichtsveld</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.75);
  color: white;
  text-align: center;
}

button {
  display: block;
  width: min(90%, 420px);
  margin: 10px auto;
  padding: 18px;
  border: 0;
  border-radius: 15px;
  font-size: 22px;
  font-weight: bold;
}

label {
  display: block;
  font-size: 22px;
  margin-top: 20px;
}

input[type="range"] {
  width: 80%;
  margin: 15px auto;
  height: 35px;
}

#status {
  margin-top: 10px;
  font-size: 18px;
  color: #ff7777;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<div id="controls">

  <button id="start">Camera starten</button>

  <button id="switch">Camera omkeren</button>

  <button id="fullscreen">Volledig scherm</button>

  <label>
    Gezichtsveld:
    <span id="value">100%</span>
  </label>

  <input
    id="fov"
    type="range"
    min="20"
    max="100"
    value="100"
  >

  <div id="status"></div>

</div>

<script>
const video = document.getElementById("camera");
const startButton = document.getElementById("start");
const switchButton = document.getElementById("switch");
const fullscreenButton = document.getElementById("fullscreen");
const slider = document.getElementById("fov");
const value = document.getElementById("value");
const status = document.getElementById("status");

let stream = null;
let facingMode = "environment";

function updateView() {
  const fov = Number(slider.value);

  value.textContent = fov + "%";

  /*
    100% = normaal beeld
    lagere waarden = smaller gezichtsveld
  */
  const zoom = 100 / fov;

  video.style.transform = `scale(${zoom})`;
}

slider.addEventListener("input", updateView);

async function startCamera() {

  status.textContent = "";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent =
      "Deze browser ondersteunt geen cameratoegang.";
    return;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: facingMode
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    status.textContent = "";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera kon niet worden gestart: " + error.message;
  }
}

startButton.addEventListener("click", startCamera);

switchButton.addEventListener("click", async () => {

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await startCamera();
});

fullscreenButton.addEventListener("click", async () => {

  try {

    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    }

  } catch (error) {
    console.log(error);
  }
});

updateView();
</script>

</body>
</html>
